name: Offline validation

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  offline-checks:
    name: Offline checks (Python + Node)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Playwright and deps
        run: |
          pip install --upgrade pip
          pip install playwright pillow
          playwright install chromium
      - name: Run Python offline checks
        run: |
          python3 scripts/validate-candidate.py --output /tmp/offline-checks
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Run Node protocol tests
        working-directory: tests/bridge
        run: |
          node test_host.mjs
          node test_host_shim.mjs
          node test_shim.mjs
      - name: Check for secrets (trufflehog)
        run: |
          pip install trufflehog3
          trufflehog3 --no-history --no-entropy --only-verified --fail

  manifest-check:
    name: Manifest & provenance integrity
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify static-sha256.json manifests
        run: python3 scripts/verify_manifests.py