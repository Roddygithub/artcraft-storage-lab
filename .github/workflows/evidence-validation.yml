name: Evidence Validation

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  evidence-validation:
    name: Evidence Validation (Proxmox Isolated)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: |
          pip install --upgrade pip
      - name: Verify Proxmox isolated evidence
        run: |
          python3 lab/real-seafile/results/2026-11-17-proxmox-isolated/verify.py
      - name: Verify evidence integrity
        run: |
          # Ensure all required artifacts exist and have correct hashes
          cd lab/real-seafile/results/2026-11-17-proxmox-isolated
          sha256sum -c SHA256SUMS
      - name: Check for secrets in evidence
        run: |
          # Scan for potential secrets in evidence files
          cd lab/real-seafile/results/2026-11-17-proxmox-isolated
          # Check for common secret patterns (but allow known infrastructure identifiers)
          ! grep -r "password\|secret\|token\|key" --include="*.json" . | grep -v "access_token\|WOPISrc\|repo_id\|session" || true

  manifest-check:
    name: Manifest & provenance integrity
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify static-sha256.json manifests
        run: python3 scripts/verify_manifests.py