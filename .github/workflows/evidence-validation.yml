name: Evidence Validation

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  evidence-validation:
    name: Evidence Validation (Proxmox Isolated)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: |
          pip install --upgrade pip
      - name: Verify Proxmox isolated evidence
        run: |
          python3 lab/real-seafile/results/2026-11-17-proxmox-isolated/verify.py
      - name: Verify evidence integrity
        run: |
          # Ensure all required artifacts exist and have correct hashes
          cd lab/real-seafile/results/2026-11-17-proxmox-isolated
          sha256sum -c SHA256SUMS
      - name: Check for secrets in evidence (gitleaks)
        run: |
          curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.18.1/gitleaks_8.18.1_linux_x64.tar.gz | tar xz -C /tmp
          /tmp/gitleaks detect --source lab/real-seafile/results/2026-11-17-proxmox-isolated --config .gitleaks.toml --verbose --redact --exit-code 1

  provenance-reproducibility:
    name: Provenance Reproducibility Check
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify browser runner provenance
        run: |
          python3 scripts/reproduce_browser_runner.py

  manifest-check:
    name: Manifest & provenance integrity
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify static-sha256.json manifests
        run: python3 scripts/verify_manifests.py