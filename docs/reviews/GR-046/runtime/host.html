<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>GR-046 synthetic host</title>
<style>html,body{margin:0;width:100%;height:100%;font:14px system-ui,sans-serif;background:#151515;color:#eee}#bar{height:70px;box-sizing:border-box;padding:8px 14px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}#status{flex:1;min-width:300px}#meta{flex-basis:100%;font:11px ui-monospace,monospace}iframe{width:100%;height:calc(100% - 70px);border:0}button{padding:7px 10px}</style></head>
<body><div id="bar"><strong>GR-046 synthetic host</strong><span id="status">Waiting for EffectCraft…</span><button id="reopen" disabled>Reopen captured bytes</button><span id="meta">No save captured</span></div><iframe id="editor" title="EffectCraft editor"></iframe>
<script>
const frame=document.querySelector('#editor'),status=document.querySelector('#status'),meta=document.querySelector('#meta'),reopen=document.querySelector('#reopen');let savedBytes=null,savedTicket=null,savedHash=null,reopening=false;
async function open(bytes){const b=bytes.slice();frame.contentWindow.postMessage({type:'effectcraft:open',name:'GR-046-synthetic.ecproj',bytes:b.buffer},location.origin,[b.buffer]);}
window.addEventListener('message',async e=>{if(e.origin!==location.origin||e.source!==frame.contentWindow)return;const m=e.data||{};if(m.type==='effectcraft:ready'){let bytes=reopening?savedBytes:new Uint8Array(await(await fetch('./synthetic.ecproj')).arrayBuffer());await open(bytes);status.textContent=`${reopening?'Reopened captured':'Opened native synthetic'} project (${bytes.byteLength} bytes)`;}else if(m.type==='effectcraft:dirty'){status.textContent=reopening&&!m.dirty?`Fresh iframe reopened captured bytes; clean (ticket ${savedTicket}, SHA-256 ${savedHash})`:`Editor dirty=${m.dirty}`;}else if(m.type==='effectcraft:save'){const v=m.bytes instanceof ArrayBuffer?new Uint8Array(m.bytes):new Uint8Array(m.bytes.buffer,m.bytes.byteOffset,m.bytes.byteLength);savedBytes=v.slice();savedTicket=m.ticket;savedHash=[...new Uint8Array(await crypto.subtle.digest('SHA-256',savedBytes))].map(x=>x.toString(16).padStart(2,'0')).join('');meta.textContent=`Captured ${savedBytes.length} bytes · SHA-256 ${savedHash} · ACK ${savedTicket}`;frame.contentWindow.postMessage({type:'effectcraft:saveResult',ticket:m.ticket,ok:true},location.origin);status.textContent=`Captured serialized bytes; sent matching positive ACK ${savedTicket}`;reopen.disabled=false;}else if(m.type==='effectcraft:failed'){status.textContent=`EffectCraft failed: ${m.error}`;}});
reopen.addEventListener('click',()=>{if(!savedBytes)return;reopening=true;frame.src=`./index.html?host=parent&empty&noworkers&nogpuworkers&nosw&reopen=${Date.now()}`;status.textContent='Starting fresh EffectCraft instance…';});
frame.src='./index.html?host=parent&empty&noworkers&nogpuworkers&nosw';
</script></body></html>
