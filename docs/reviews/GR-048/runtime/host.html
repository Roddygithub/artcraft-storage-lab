<!doctype html>
<meta charset="utf-8">
<title>GR-048 FigCraft host-save smoke</title>
<style>body{font:14px system-ui;margin:12px}#log{max-height:180px;overflow:auto}iframe{width:100%;height:720px;border:1px solid #888}</style>
<h1>GR-048 synthetic FigCraft host — MEMORY ONLY, no Seafile</h1>
<pre id="log">waiting for FigCraft…</pre>
<div id="mount"></div>
<script>
const logEl = document.querySelector('#log');
const log = (key, value) => { window.gr048[key] = value; logEl.textContent = JSON.stringify(window.gr048, (k,v) => v instanceof Uint8Array ? `[Uint8Array ${v.byteLength} bytes]` : v, 2); };
window.gr048 = {phase:'initializing', savedBytes:null, savedTicket:null, dirty:null, ready:null, reopened:false, editResult:null};
window.gr048.events = [];
let generation = 0;
window.gr048.verify = () => {
 const s=window.gr048;
 const types=s.events.map(e=>e.type);
 if (s.dirtyBeforeAck!==true || !s.savedSize || !s.saveSha256 || !s.savedTicket || s.ackTicket!==s.savedTicket || !s.reopened || s.dirty!==false || !s.events.some(e=>e.dirty===true) || !s.events.some(e=>e.generation===2 && e.type==='figcraft:ready')) throw Error('incomplete smoke evidence');
 return {result:'bounded synthetic transport PASS',size:s.savedSize,sha256:s.saveSha256,ticket:s.savedTicket,dirty:s.dirty,reopened:s.reopened};
};
let pendingOpen = null;
function frame(bytes) {
  generation++;
  const old = document.querySelector('iframe');
  if (old) old.remove();
  const f = document.createElement('iframe');
  f.id = 'editor';
  f.src = `/index.html?host=parent&webgl&gr048=${generation}`;
  document.querySelector('#mount').append(f);
  pendingOpen = bytes || null;
  return f;
}
let first = true;
frame(null);
addEventListener('message', event => {
  if (event.origin !== location.origin || event.source !== document.querySelector('iframe')?.contentWindow) return;
  const m = event.data;
  if (!m || typeof m.type !== 'string') return;
  window.gr048.events.push({generation,type:m.type,ticket:m.ticket,dirty:m.dirty,size:m.bytes?.byteLength});
  if (m.type === 'figcraft:ready') {
    log('ready', m.version);
    if (first) {
      first = false;
      fetch('/synthetic.figcraft').then(r => { if (!r.ok) throw Error(`fixture HTTP ${r.status}`); return r.arrayBuffer(); }).then(bytes => {
        log('inputBytes', bytes.byteLength);
        pendingOpen = bytes;
        document.querySelector('iframe').contentWindow.postMessage({type:'figcraft:open',name:'synthetic.figcraft',bytes}, location.origin);
        log('phase','opened');
      }).catch(e => log('error',String(e)));
    } else if (pendingOpen) {
      const bytes = pendingOpen;
      pendingOpen = null;
      document.querySelector('iframe').contentWindow.postMessage({type:'figcraft:open',name:'synthetic.figcraft',bytes}, location.origin);
      log('phase','reopened');
    }
  } else if (m.type === 'figcraft:dirty') {
    log('dirty',m.dirty);
    if (generation > 1 && m.dirty === false) { log('reopened',true); log('phase','reopened-clean'); }
  } else if (m.type === 'figcraft:save') {
    const bytes = new Uint8Array(m.bytes);
    window.gr048.savedBytes = bytes;
    window.gr048.savedTicket = m.ticket;
    window.gr048.savedName = m.name;
    window.gr048.saveAs = m.saveAs;
    window.gr048.savedSize = bytes.byteLength;
    log('phase','save-captured');
    crypto.subtle.digest('SHA-256',bytes).then(b => window.gr048.saveSha256=[...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join(''));
    window.gr048.ack = () => { if (window.gr048.dirty !== true) throw Error('editor unexpectedly clean before ACK'); window.gr048.dirtyBeforeAck = window.gr048.dirty; document.querySelector('iframe').contentWindow.postMessage({type:'figcraft:saveResult',ticket:m.ticket,ok:true},location.origin); log('ackTicket',m.ticket); };
    log('phase','save-captured-awaiting-explicit-ack');
  }
});
window.gr048.reopen = () => {
  const bytes = window.gr048.savedBytes;
  if (!(bytes instanceof Uint8Array)) throw Error('no captured save bytes');
  frame(bytes.buffer.slice(bytes.byteOffset,bytes.byteOffset+bytes.byteLength));
  log('phase','fresh-iframe-reopen-requested');
};
</script>
