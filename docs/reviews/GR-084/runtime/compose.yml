services:
  db:
    image: docker.io/library/mariadb:10.11
    restart: no
    environment:
      - MYSQL_ROOT_PASSWORD=${INIT_SEAFILE_MYSQL_ROOT_PASSWORD}
      - MYSQL_LOG_CONSOLE=true
      - MARIADB_AUTO_UPGRADE=1
    volumes:
      - ./data/mysql:/var/lib/mysql
    networks:
      - seafile-net
    healthcheck:
      test:
        - CMD
        - /usr/local/bin/healthcheck.sh
        - --connect
        - --mariadbupgrade
        - --innodb_initialized
      interval: 20s
      start_period: 30s
      timeout: 5s
      retries: 10
    container_name: artcraft-wopi-pdfcraft-r7-db
    mem_limit: 384m
    cpus: 0.5
  redis:
    image: docker.io/library/redis:7
    restart: no
    command:
      - /bin/sh
      - -c
      - exec redis-server --requirepass "$$REDIS_PASSWORD" --save ''
        --appendonly no
    environment:
      - REDIS_PASSWORD=${REDIS_PASSWORD}
    networks:
      - seafile-net
    container_name: artcraft-wopi-pdfcraft-r7-redis
    mem_limit: 96m
    cpus: 0.5
  seafile:
    image: docker.io/seafileltd/seafile-mc:13.0-latest
    container_name: artcraft-wopi-pdfcraft-r7-seafile
    restart: no
    ports:
      - 127.0.0.1:19000:80
    volumes:
      - ./data/seafile:/shared
    environment:
      - SEAFILE_MYSQL_DB_HOST=db
      - SEAFILE_MYSQL_DB_PORT=3306
      - SEAFILE_MYSQL_DB_USER=seafile
      - SEAFILE_MYSQL_DB_PASSWORD=${SEAFILE_MYSQL_DB_PASSWORD}
      - INIT_SEAFILE_MYSQL_ROOT_PASSWORD=${INIT_SEAFILE_MYSQL_ROOT_PASSWORD}
      - SEAFILE_MYSQL_DB_CCNET_DB_NAME=ccnet_db
      - SEAFILE_MYSQL_DB_SEAFILE_DB_NAME=seafile_db
      - SEAFILE_MYSQL_DB_SEAHUB_DB_NAME=seahub_db
      - TIME_ZONE=Etc/UTC
      - INIT_SEAFILE_ADMIN_EMAIL=${ADMIN_EMAIL}
      - INIT_SEAFILE_ADMIN_PASSWORD=${ADMIN_PASSWORD}
      - SEAFILE_SERVER_HOSTNAME=seafile.lab
      - SEAFILE_SERVER_PROTOCOL=http
      - SITE_ROOT=/
      - NON_ROOT=false
      - JWT_PRIVATE_KEY=${JWT_PRIVATE_KEY}
      - SEAFILE_LOG_TO_STDOUT=false
      - ENABLE_GO_FILESERVER=true
      - ENABLE_SEADOC=false
      - CACHE_PROVIDER=redis
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=${REDIS_PASSWORD}
      - ENABLE_NOTIFICATION_SERVER=false
      - ENABLE_SEAFILE_AI=false
      - ENABLE_FACE_RECOGNITION=false
      - MD_FILE_COUNT_LIMIT=100000
    healthcheck:
      test:
        - CMD-SHELL
        - curl -f http://localhost:80 || exit 1
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    networks:
      seafile-net:
        aliases:
          - seafile.lab
    mem_limit: 1280m
    cpus: 1
  onlyoffice:
    image: docker.io/onlyoffice/documentserver:9.4
    container_name: artcraft-wopi-pdfcraft-r7-onlyoffice
    restart: no
    ports:
      - 127.0.0.1:19010:80
    environment:
      - JWT_ENABLED=true
      - JWT_SECRET=${ONLYOFFICE_JWT_SECRET}
      - JWT_HEADER=Authorization
      - ALLOW_PRIVATE_IP_ADDRESS=true
      - ALLOW_META_IP_ADDRESS=true
    networks:
      - seafile-net
    mem_limit: 1280m
    cpus: 1
  bridge:
    image: docker.io/library/python:3.12-slim
    container_name: artcraft-wopi-pdfcraft-r7-bridge
    restart: no
    working_dir: /app
    command:
      - python3
      - -m
      - bridge
    ports:
      - 127.0.0.1:19018:8778
    volumes:
      - ./app:/app:ro
    environment:
      - BRIDGE_PUBLIC_URL=http://bridge:8778
      - BRIDGE_SEAHUB_ORIGIN=http://seafile.lab
      - BRIDGE_EDITORS=/app/lab/real-seafile/editors.json
      - BRIDGE_STATIC_DIR=/app/lab/real-seafile/static
      - BRIDGE_BIND=0.0.0.0
      - BRIDGE_PORT=8778
    networks:
      - seafile-net
    mem_limit: 96m
    cpus: 0.5
  slice:
    image: docker.io/library/python:3.12-slim
    profiles:
      - test
    working_dir: /app
    command:
      - python3
      - -I
      - lab/real-seafile/run_slice.py
    volumes:
      - ./app:/app:ro
      - ./results:/results
    environment:
      - SEAFILE_URL=http://seafile.lab
      - BRIDGE_URL=http://bridge:8778
      - ONLYOFFICE_URL=http://onlyoffice
      - ONLYOFFICE_JWT_SECRET=${ONLYOFFICE_JWT_SECRET}
      - ADMIN_EMAIL=${ADMIN_EMAIL}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD}
      - RESULTS_DIR=/results
    networks:
      - seafile-net
    container_name: artcraft-wopi-pdfcraft-r7-slice
    restart: no
    mem_limit: 256m
    cpus: 0.5
  browser:
    image: mcr.microsoft.com/playwright/python:v1.49.0-noble
    profiles:
      - test
    working_dir: /app
    command:
      - bash
      - -c
      - pip install -q --break-system-packages playwright==1.49.0 Pillow==13.0.0 && python3
        lab/real-seafile/run_browser.py
    ipc: private
    volumes:
      - ./app:/app:ro
      - ./results:/results
    environment:
      - SEAFILE_URL=http://seafile.lab
      - BRIDGE_URL=http://bridge:8778
      - ONLYOFFICE_URL=http://onlyoffice
      - ONLYOFFICE_JWT_SECRET=${ONLYOFFICE_JWT_SECRET}
      - ADMIN_EMAIL=${ADMIN_EMAIL}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD}
      - RESULTS_DIR=/results
      - BROWSER_ONLY_EDITOR=pdfcraft
    networks:
      - seafile-net
    container_name: artcraft-wopi-pdfcraft-r7-browser
    restart: no
    mem_limit: 896m
    cpus: 1.5
    shm_size: 256m
networks:
  seafile-net:
    name: artcraft-wopi-pdfcraft-r7-net
