<!doctype html><meta charset="utf-8"><title>GridCraft shared-host transport smoke test</title><style>body{font:14px sans-serif;margin:12px}#bar{display:flex;gap:12px;align-items:center;margin-bottom:8px}#status,#openRequests{font-family:monospace}.frame{width:100%;height:82vh;border:1px solid #888}</style><div id="bar"><button id="reopen">Close and reopen stored bytes</button><button id="reset">Reset fixture</button><label><input id="reject" type="checkbox"> reject next save</label><span id="status">waiting for GridCraft…</span><span id="openRequests">open requests:0</span></div><iframe id="editor" class="frame"></iframe><script>
const frame=document.getElementById('editor'),status=document.getElementById('status'),key='gr016-gridcraft-xlsx';let opening=false,rejectNext=false,openRequests=0;document.getElementById('reject').onchange=e=>rejectNext=e.target.checked;function b64(b){let s='';for(let i=0;i<b.length;i+=32768)s+=String.fromCharCode(...b.subarray(i,i+32768));return btoa(s)}function unb64(s){const x=atob(s),b=new Uint8Array(x.length);for(let i=0;i<x.length;i++)b[i]=x.charCodeAt(i);return b}async function open(){if(opening)return;opening=true;try{const stored=sessionStorage.getItem(key),b=stored?unb64(stored):new Uint8Array(await(await fetch('./synthetic.xlsx')).arrayBuffer());status.textContent=`opening ${b.length} bytes`;const buf=b.buffer;frame.contentWindow.postMessage({type:'gridcraft:open',name:stored?'GR016-saved.xlsx':'GR016-fixture.xlsx',bytes:buf},location.origin,[buf])}catch(e){status.textContent='open failed '+e}finally{opening=false}}window.addEventListener('message',async e=>{if(e.origin!==location.origin||e.source!==frame.contentWindow)return;const m=e.data||{};if(m.type==='gridcraft:ready'){status.textContent='ready; opening workbook';await open()}if(m.type==='gridcraft:openRequest'){openRequests++;document.getElementById('openRequests').textContent=`open requests:${openRequests}`;await open()}if(m.type==='gridcraft:dirty')status.textContent='dirty='+m.dirty;if(m.type==='gridcraft:save'){const b=m.bytes instanceof ArrayBuffer?new Uint8Array(m.bytes):new Uint8Array(m.bytes.buffer,m.bytes.byteOffset,m.bytes.byteLength);if(rejectNext){rejectNext=false;document.getElementById('reject').checked=false;frame.contentWindow.postMessage({type:'gridcraft:saveResult',ticket:m.ticket,ok:false,error:'synthetic rejection'},location.origin);status.textContent=`rejected ${m.ticket} (${b.length} bytes)`;return}sessionStorage.setItem(key,b64(b));const hash=Array.from(new Uint8Array(await crypto.subtle.digest('SHA-256',b)),x=>x.toString(16).padStart(2,'0')).join('');frame.contentWindow.postMessage({type:'gridcraft:saveResult',ticket:m.ticket,ok:true},location.origin);status.textContent=`stored ${b.length} bytes sha256=${hash.slice(0,16)}…; ack ${m.ticket}`}});document.getElementById('reopen').onclick=()=>{frame.src='./index.html?host=parent&webgl&reopen='+Date.now();status.textContent='fresh editor load…'};document.getElementById('reset').onclick=()=>{sessionStorage.removeItem(key);frame.src='./index.html?host=parent&webgl&reset='+Date.now();status.textContent='fixture reload…'};frame.src='./index.html?host=parent&webgl';</script>
