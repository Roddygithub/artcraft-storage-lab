# Real-Seafile validation slice: stock Seafile CE 13 + ONLYOFFICE Docs CE + the WOPI bridge.
# Derived from the official Seafile 13.0 compose (seafile-server.yml); caddy and seadoc dropped,
# everything talks on the internal network by service name (Seafile's setup script insists on a
# dotted hostname, hence the seafile.lab alias). Nothing here touches production.
services:
  db:
    image: mariadb:10.11
    restart: unless-stopped
    environment:
      - MYSQL_ROOT_PASSWORD=${INIT_SEAFILE_MYSQL_ROOT_PASSWORD}
      - MYSQL_LOG_CONSOLE=true
      - MARIADB_AUTO_UPGRADE=1
    volumes:
      - ./data/mysql:/var/lib/mysql
    networks: [seafile-net]
    healthcheck:
      test: ["CMD", "/usr/local/bin/healthcheck.sh", "--connect", "--mariadbupgrade", "--innodb_initialized"]
      interval: 20s
      start_period: 30s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7
    restart: unless-stopped
    command: ["/bin/sh", "-c", "exec redis-server --requirepass \"$$REDIS_PASSWORD\" --save '' --appendonly no"]
    environment:
      - REDIS_PASSWORD=${REDIS_PASSWORD}
    networks: [seafile-net]

  seafile:
    image: seafileltd/seafile-mc:13.0-latest
    container_name: seafile
    restart: unless-stopped
    ports:
      - "127.0.0.1:8000:80"
    volumes:
      - ./data/seafile:/shared
    environment:
      - SEAFILE_MYSQL_DB_HOST=db
      - SEAFILE_MYSQL_DB_PORT=3306
      - SEAFILE_MYSQL_DB_USER=seafile
      - SEAFILE_MYSQL_DB_PASSWORD=${SEAFILE_MYSQL_DB_PASSWORD}
      - INIT_SEAFILE_MYSQL_ROOT_PASSWORD=${INIT_SEAFILE_MYSQL_ROOT_PASSWORD}
      - SEAFILE_MYSQL_DB_CCNET_DB_NAME=ccnet_db
      - SEAFILE_MYSQL_DB_SEAFILE_DB_NAME=seafile_db
      - SEAFILE_MYSQL_DB_SEAHUB_DB_NAME=seahub_db
      - TIME_ZONE=Etc/UTC
      - INIT_SEAFILE_ADMIN_EMAIL=${ADMIN_EMAIL}
      - INIT_SEAFILE_ADMIN_PASSWORD=${ADMIN_PASSWORD}
      - SEAFILE_SERVER_HOSTNAME=seafile.lab
      - SEAFILE_SERVER_PROTOCOL=http
      - SITE_ROOT=/
      - NON_ROOT=false
      - JWT_PRIVATE_KEY=${JWT_PRIVATE_KEY}
      - SEAFILE_LOG_TO_STDOUT=false
      - ENABLE_GO_FILESERVER=true
      - ENABLE_SEADOC=false
      - CACHE_PROVIDER=redis
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=${REDIS_PASSWORD}
      - ENABLE_NOTIFICATION_SERVER=false
      - ENABLE_SEAFILE_AI=false
      - ENABLE_FACE_RECOGNITION=false
      - MD_FILE_COUNT_LIMIT=100000
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:80 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    depends_on:
      db: { condition: service_healthy }
      redis: { condition: service_started }
    networks:
      seafile-net:
        aliases: [seafile.lab]

  onlyoffice:
    image: onlyoffice/documentserver:9.4
    container_name: onlyoffice
    restart: unless-stopped
    ports:
      - "127.0.0.1:8100:80"
    environment:
      - JWT_ENABLED=true
      - JWT_SECRET=${ONLYOFFICE_JWT_SECRET}
      - JWT_HEADER=Authorization
      # Docs blocks private/meta IPs by default; Seafile lives on the private compose network.
      - ALLOW_PRIVATE_IP_ADDRESS=true
      - ALLOW_META_IP_ADDRESS=true
    networks: [seafile-net]

  bridge:
    image: python:3.12-slim
    container_name: bridge
    restart: unless-stopped
    working_dir: /app
    command: ["python3", "-m", "bridge"]
    ports:
      - "127.0.0.1:8778:8778"
    volumes:
      - ./app:/app:ro
    environment:
      - BRIDGE_PUBLIC_URL=http://bridge:8778
      - BRIDGE_SEAHUB_ORIGIN=http://seafile.lab
      - BRIDGE_EDITORS=/app/lab/real-seafile/editors.json
      - BRIDGE_STATIC_DIR=/app/lab/real-seafile/static
      - BRIDGE_BIND=0.0.0.0
      - BRIDGE_PORT=8778
    networks: [seafile-net]

  slice:
    image: python:3.12-slim
    profiles: [test]
    working_dir: /app
    command: ["python3", "-I", "lab/real-seafile/run_slice.py"]
    volumes:
      - ./app:/app:ro
      - ./results:/results
    environment:
      - SEAFILE_URL=http://seafile.lab
      - BRIDGE_URL=http://bridge:8778
      - ONLYOFFICE_URL=http://onlyoffice
      - ONLYOFFICE_JWT_SECRET=${ONLYOFFICE_JWT_SECRET}
      - ADMIN_EMAIL=${ADMIN_EMAIL}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD}
      - RESULTS_DIR=/results
    networks: [seafile-net]

  browser:
    image: mcr.microsoft.com/playwright/python:v1.49.0-noble
    profiles: [test]
    working_dir: /app
    command: ["bash", "-c", "pip install -q --break-system-packages playwright==1.49.0 && python3 lab/real-seafile/run_browser.py"]
    ipc: host
    volumes:
      - ./app:/app:ro
      - ./results:/results
    environment:
      - SEAFILE_URL=http://seafile.lab
      - BRIDGE_URL=http://bridge:8778
      - ONLYOFFICE_URL=http://onlyoffice
      - ONLYOFFICE_JWT_SECRET=${ONLYOFFICE_JWT_SECRET}
      - ADMIN_EMAIL=${ADMIN_EMAIL}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD}
      - RESULTS_DIR=/results
    networks: [seafile-net]

networks:
  seafile-net:
    name: seafile-net
