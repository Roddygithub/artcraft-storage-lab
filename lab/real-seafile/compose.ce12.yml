# Isolated synthetic Seafile CE 12 profile, adapted from the official CE12 compose:
# https://manual.seafile.com/12.0/repo/docker/ce/seafile-server.yml
# Upstream source SHA-256: 883a961ed96d559e845e249cddff1e51a0375e04e889149749d8eb990fa7a69e
# CE12 image pinned to the inspected 12.0.14 digest by local_ce12.py.
# No fixed container/network names; all data is private to the run directory.
services:
  db:
    image: ${SEAFILE_DB_IMAGE}
    mem_limit: 384m
    cpus: 0.5
    environment:
      MYSQL_ROOT_PASSWORD: ${INIT_SEAFILE_MYSQL_ROOT_PASSWORD}
      MYSQL_LOG_CONSOLE: "true"
      MARIADB_AUTO_UPGRADE: "1"
    volumes:
      - ./data/mysql:/var/lib/mysql:Z
    healthcheck:
      test: ["CMD", "/usr/local/bin/healthcheck.sh", "--connect", "--mariadbupgrade", "--innodb_initialized"]
      interval: 20s
      start_period: 30s
      timeout: 5s
      retries: 10

  memcached:
    image: ${SEAFILE_MEMCACHED_IMAGE}
    mem_limit: 128m
    cpus: 0.25
    entrypoint: memcached -m 256

  seafile:
    image: ${SEAFILE_IMAGE}
    mem_limit: 1400m
    cpus: 1.25
    ports:
      - "127.0.0.1:${SEAFILE_PORT}:80"
    volumes:
      - ./data/seafile:/shared:Z
    environment:
      DB_HOST: db
      DB_PORT: "3306"
      DB_USER: seafile
      DB_ROOT_PASSWD: ${INIT_SEAFILE_MYSQL_ROOT_PASSWORD}
      DB_PASSWORD: ${SEAFILE_MYSQL_DB_PASSWORD}
      SEAFILE_MYSQL_DB_CCNET_DB_NAME: ccnet_db
      SEAFILE_MYSQL_DB_SEAFILE_DB_NAME: seafile_db
      SEAFILE_MYSQL_DB_SEAHUB_DB_NAME: seahub_db
      TIME_ZONE: Etc/UTC
      INIT_SEAFILE_ADMIN_EMAIL: ${INIT_SEAFILE_ADMIN_EMAIL}
      INIT_SEAFILE_ADMIN_PASSWORD: ${INIT_SEAFILE_ADMIN_PASSWORD}
      SEAFILE_SERVER_HOSTNAME: seafile.lab
      SEAFILE_SERVER_PROTOCOL: http
      SITE_ROOT: /
      NON_ROOT: "false"
      JWT_PRIVATE_KEY: ${JWT_PRIVATE_KEY}
      SEAFILE_LOG_TO_STDOUT: "true"
      ENABLE_SEADOC: "false"
    depends_on:
      db:
        condition: service_healthy
      memcached:
        condition: service_started
    networks:
      default:
        aliases: [seafile.lab]

  bridge:
    image: docker.io/library/python:3.12-slim
    mem_limit: 128m
    cpus: 0.25
    working_dir: /app
    command: ["python3", "-m", "bridge"]
    volumes: ["./app:/app:ro,z"]
    environment:
      BRIDGE_PUBLIC_URL: http://bridge:8778
      BRIDGE_SEAHUB_ORIGIN: http://seafile.lab
      BRIDGE_EDITORS: /app/lab/real-seafile/editors.json
      BRIDGE_STATIC_DIR: /app/lab/real-seafile/static
      BRIDGE_BIND: 0.0.0.0
      BRIDGE_PORT: "8778"
    networks: [default]

  browser:
    image: mcr.microsoft.com/playwright/python:v1.49.0-noble
    mem_limit: 896m
    cpus: 1.0
    working_dir: /app
    command: ["bash", "-lc", "apt-get update -qq && apt-get install -y -qq --no-install-recommends tesseract-ocr && pip install -q --break-system-packages playwright==1.49.0 Pillow==13.0.0 && python3 lab/real-seafile/run_browser.py"]
    ipc: private
    shm_size: 1gb
    volumes: ["./app:/app:ro,z", "./results:/results:z"]
    environment:
      SEAFILE_URL: http://seafile.lab
      BRIDGE_URL: http://bridge:8778
      ADMIN_EMAIL: ${INIT_SEAFILE_ADMIN_EMAIL}
      ADMIN_PASSWORD: ${INIT_SEAFILE_ADMIN_PASSWORD}
      RESULTS_DIR: /results
      BROWSER_EDITOR_CONFIG: /app/lab/real-seafile/editors.json
    networks: [default]
